# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /springbootniyfl


spring:
    profiles:
        active: dev

    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:springbootniyfl}?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:123456}

    servlet:
      multipart:
        max-file-size: 300MB
        max-request-size: 300MB
    resources:
      static-locations: classpath:static/,file:static/

# 百度 OCR 凭证 —— 通过环境变量注入，禁止明文写入代码
baidu:
    ocr:
        app-id: ${BAIDU_OCR_APP_ID:}
        api-key: ${BAIDU_OCR_API_KEY:}
        secret-key: ${BAIDU_OCR_SECRET_KEY:}
        # 连接超时（毫秒），边缘节点网络不稳定时建议调大
        connect-timeout: ${BAIDU_OCR_CONNECT_TIMEOUT:5000}
        # Socket 读取超时（毫秒），大图识别时建议调大
        socket-timeout: ${BAIDU_OCR_SOCKET_TIMEOUT:60000}

#mybatis
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.entity
  global-config:
    #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
    id-type: 1
    #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
    field-strategy: 1
    #驼峰下划线转换
    db-column-underline: true
    #刷新mapper 调试神器
    refresh-mapper: true
    #逻辑删除配置
    logic-delete-value: -1
    logic-not-delete-value: 0
    #自定义SQL注入器
    sql-injector: com.baomidou.mybatisplus.mapper.LogicSqlInjector
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    #springboot 项目mybatis plus 设置 jdbcTypeForNull (oracle数据库需配置JdbcType.NULL, 默认是Other)
    jdbc-type-for-null: 'null'
